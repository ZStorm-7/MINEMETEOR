<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mine Meteor</title>
<meta name="description" content="Mine Meteor — the Minecraft knowledge agent. Recipes, mobs, redstone, biomes and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sky" aria-hidden="true"><i class="m m1"></i><i class="m m2"></i><i class="m m3"></i></div>
<div class="ground" aria-hidden="true"></div>
<header class="hero">
  <h1>☄️ Mine <span>Meteor</span></h1>
  <p>Your Minecraft knowledge agent — recipes, mobs, redstone &amp; more.</p>
</header>
<main class="chat">
  <div id="log" class="log" role="log" aria-live="polite"></div>
  <div class="chips" id="chips">
    <button>How do I craft an anvil?</button>
    <button>Where do I find diamonds?</button>
    <button>How do I build a redstone clock?</button>
  </div>
  <form id="form" class="composer">
    <input id="input" autocomplete="off" placeholder="Ask Mine Meteor anything…" aria-label="Message" required>
    <button type="submit">Send ⛏️</button>
  </form>
</main>
<footer>Mine Meteor · unofficial fan project, not affiliated with Mojang or Microsoft</footer>
<script src="app.js"></script>
</body>
</html>
