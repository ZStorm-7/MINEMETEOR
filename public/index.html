<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mine Meteor</title>
<meta name="description" content="Mine Meteor — the Minecraft knowledge agent. Recipes, mobs, redstone, biomes and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sky" aria-hidden="true"><i class="m m1"></i><i class="m m2"></i><i class="m m3"></i><i class="moon"></i><i class="sun"></i><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i><i class="cloud c4"></i></div>

<header class="hero">
  <img class="logo" src="logo.svg" alt="" width="80" height="80">
  <h1>Mine <span>Meteor</span></h1>
  <p>Your Minecraft knowledge agent — recipes, mobs, redstone &amp; more.</p>
</header>
<main class="chat">
  <div id="log" class="log" role="log" aria-live="polite"></div>
  <div class="menu" id="menu" hidden>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="qs" id="qs"></div>
  </div>
  <form id="form" class="composer">
    <button type="button" id="menuBtn" class="menu-btn" aria-expanded="false" aria-controls="menu">☰ Menu</button>
    <input id="input" autocomplete="off" placeholder="Ask Mine Meteor anything…" aria-label="Message" required>
    <button type="submit">Send ⛏️</button>
  </form>
</main>

<div class="ground"><footer>Mine Meteor · unofficial fan project, not affiliated with Mojang or Microsoft</footer></div>
<script src="app.js"></script>
</body>
</html>
