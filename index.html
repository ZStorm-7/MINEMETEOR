<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mine Meteor</title>
<meta name="description" content="Mine Meteor — the AI agent that knows fandoms, crafting, mods and more.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<header class="hero">
  <h1>☄️ Mine <span>Meteor</span></h1>
  <p>Fandoms, crafting, mods &amp; more — ask anything, get the details.</p>
</header>
<main class="chat">
  <div id="log" class="log" role="log" aria-live="polite"></div>
  <div class="chips" id="chips">
    <button>How do I craft an anvil?</button>
    <button>Best mods for a tech pack?</button>
    <button>Explain Redstone clocks</button>
  </div>
  <form id="form" class="composer">
    <input id="input" autocomplete="off" placeholder="Ask Mine Meteor anything…" aria-label="Message" required>
    <button type="submit">Send ⛏️</button>
  </form>
</main>
<footer>Mine Meteor · not affiliated with Mojang or any game studio</footer>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
